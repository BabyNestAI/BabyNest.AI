<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BabyCare AI</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  transition: 0.3s;
}

/* THEMES */
body.dark {
  background: #343541;
  color: #ececf1;
}

body.light {
  background: #f5f5f5;
  color: #111;
}

/* HEADER */
header {
  padding: 12px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #ccc;
}

/* CHAT */
.chat {
  max-width: 800px;
  margin: auto;
  padding: 15px;
  height: 70vh;
  overflow-y: auto;
}

.msg {
  margin: 10px 0;
  padding: 10px;
  border-radius: 10px;
  max-width: 80%;
}

.user { background: #19c37d; color: black; margin-left: auto; }
.ai { background: #444654; color: white; }

/* INPUT */
.inputbar {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  padding: 10px;
}

input {
  flex: 1;
  padding: 10px;
}

/* BUTTONS */
button {
  margin-left: 5px;
  padding: 10px;
}

/* FOOTER */
footer {
  text-align: center;
  font-size: 12px;
  padding: 8px;
  opacity: 0.6;
}
</style>
</head>

<body class="dark">

<header>
  <div>👶 BabyCare AI</div>
  <div>
    <button onclick="toggleTheme()">🌙</button>
    <button onclick="setBabyAge()">👶 Age</button>
  </div>
</header>

<div class="chat" id="chat"></div>

<div class="inputbar">
  <input id="input" placeholder="Ask about your baby..." />
  <button onclick="send()">Send</button>
</div>

<footer>© BabyCare AI</footer>

<script>
let babyAge = "unknown";

// LOAD HISTORY
let chatHistory = JSON.parse(localStorage.getItem("chat")) || [];
chatHistory.forEach(m => render(m.text, m.type));

// RENDER MESSAGE
function render(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

// SAVE HISTORY
function save(text, type) {
  chatHistory.push({ text, type });
  localStorage.setItem("chat", JSON.stringify(chatHistory));
}

// THEME TOGGLE
function toggleTheme() {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}

// BABY PROFILE
function setBabyAge() {
  let age = prompt("Enter baby age in months:");
  if (age) babyAge = age;
}

// VOICE OUTPUT
function speak(text) {
  let speech = new SpeechSynthesisUtterance(text);
  speech.rate = 1;
  speechSynthesis.speak(speech);
}

// AI RESPONSE (TEMP LOGIC — replace with backend later)
function aiReply(msg) {
  msg = msg.toLowerCase();

  let reply = "";

  if (msg.includes("sleep")) {
    reply = `Baby age: ${babyAge} months

Sleep Guide:
- Newborns: 14–17 hrs
- 6–12 months: 12–15 hrs

Tips:
• Keep routine
• White noise helps`;
  }
  else if (msg.includes("food")) {
    reply = `Feeding Guide:
- 0–6 months: milk only
- 6+ months: soft foods

Avoid choking hazards.`;
  }
  else {
    reply = `Ask me about sleep, food, or routines for your baby (${babyAge} months).`;
  }

  speak(reply);
  return reply;
}

// SEND MESSAGE
function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  render(text, "user");
  save(text, "user");
  input.value = "";

  setTimeout(() => {
    let reply = aiReply(text);
    render(reply, "ai");
    save(reply, "ai");
  }, 800);
}
</script>

</body>
</html>
