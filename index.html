<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BabyCare AI</title>

<style>
  .footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  text-align: center;
  font-size: 12px;
  padding: 8px;
  background: #202123;
  color: #aaa;
  border-top: 1px solid #333;
}
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #343541;
  color: #ececf1;
}

/* HEADER */
header {
  padding: 12px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #444;
}

/* PROFILE BAR */
#profileBar {
  text-align: center;
  padding: 10px;
  font-size: 14px;
  opacity: 0.9;
}

/* BUTTONS */
button {
  padding: 8px 10px;
  margin: 5px;
  cursor: pointer;
}

/* CHAT */
.chat {
  max-width: 800px;
  margin: auto;
  padding: 15px;
  height: 65vh;
  overflow-y: auto;
  padding-bottom: 60px;
}

.msg {
  margin: 10px 0;
  padding: 10px;
  border-radius: 10px;
  max-width: 80%;
  white-space: pre-wrap;
}

.user {
  background: #19c37d;
  color: black;
  margin-left: auto;
}

.ai {
  background: #444654;
}

/* INPUT */
.inputbar {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  padding: 10px;
  background: #202123;
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
}

/* FOOTER */
footer {
  text-align: center;
  font-size: 12px;
  opacity: 0.5;
  padding: 6px;
}
</style>
</head>

<body>

<header>
  <div>👶 BabyCare AI</div>
  <div>
    <button onclick="addBaby()">➕ Baby</button>
  </div>
</header>

<div id="profileBar">👶 No baby selected</div>

<div class="chat" id="chat"></div>

<div class="inputbar">
  <input id="input" placeholder="Ask about your baby..." />
  <button onclick="send()">Send</button>
</div>

<footer>© BabyCare AI</footer>

<script>
let profiles = JSON.parse(localStorage.getItem("profiles")) || {};
let activeBaby = localStorage.getItem("activeBaby") || null;

/* SAVE */
function saveData() {
  localStorage.setItem("profiles", JSON.stringify(profiles));
  localStorage.setItem("activeBaby", activeBaby);
}

/* UPDATE UI */
function updateProfileUI() {
  const bar = document.getElementById("profileBar");

  if (!activeBaby || !profiles[activeBaby]) {
    bar.innerText = "👶 No baby selected";
    return;
  }

  bar.innerText =
    `👶 ${activeBaby} — ${profiles[activeBaby].age} months`;
}

/* ADD BABY */
function addBaby() {
  let name = prompt("Baby name:");
  if (!name) return;

  let age = prompt("Baby age (months):");
  if (!age) return;

  profiles[name] = { age };
  activeBaby = name;

  saveData();
  updateProfileUI();
}

/* CHAT RENDER */
function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

/* AI LOGIC */
function aiReply(msg) {
  msg = msg.toLowerCase();

  let age = (activeBaby && profiles[activeBaby])
    ? profiles[activeBaby].age
    : "unknown";

  /* AUTO AGE DETECTION */
  if (msg.includes("cry")) {
    return `It sounds like your baby may be crying.

Baby age matters — current: ${age} months

Possible reasons:
• Hunger
• Sleepiness
• Discomfort`;
  }

  if (age === "unknown") {
    return "👶 Quick question — how old is your baby? Age helps me give better advice.";
  }

  if (msg.includes("sleep")) {
    return `(${age} months)

Sleep Guide:
• Keep routine consistent
• Avoid stimulation before bed`;
  }

  if (msg.includes("food")) {
    return `(${age} months)

Feeding:
• Adjust food texture by age
• Avoid choking hazards`;
  }

  return `Helping your ${age}-month-old baby 👶`;
}

/* SEND */
function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  addMsg(text, "user");
  input.value = "";

  setTimeout(() => {
    addMsg(aiReply(text), "ai");
  }, 700);
}

/* INIT */
updateProfileUI();
</script>
<footer class="footer">
  © 2026 BabyCare AI. All rights reserved.
</footer>
</body>
</html>
