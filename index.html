<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BabyCare AI</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #343541;
  color: #ececf1;
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: #202123;
  padding: 10px;
  display: flex;
  flex-direction: column;
}

.baby {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
}
.baby:hover { background: #2a2b32; }
.active { background: #444654; }

/* MAIN */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

header {
  padding: 12px;
  border-bottom: 1px solid #444;
  text-align: center;
}

/* CHAT */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  max-width: 800px;
  margin: auto;
  width: 100%;
}

.message {
  display: flex;
  margin: 10px 0;
}

.user { justify-content: flex-end; }
.ai { justify-content: flex-start; }

.bubble {
  padding: 12px;
  border-radius: 10px;
  max-width: 70%;
  white-space: pre-wrap;
}

.user .bubble {
  background: #19c37d;
  color: black;
}
.ai .bubble {
  background: #444654;
}

/* INPUT */
.input-bar {
  padding: 10px;
  border-top: 1px solid #444;
  display: flex;
}

input {
  flex: 1;
  padding: 10px;
  background: #40414f;
  border: none;
  color: white;
}

button {
  margin-left: 10px;
  padding: 10px;
  background: #19c37d;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* TYPING */
.typing {
  display: flex;
  gap: 5px;
}
.dot {
  width: 6px;
  height: 6px;
  background: #ccc;
  border-radius: 50%;
  animation: blink 1.5s infinite;
}
.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }

@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; }
  40% { opacity: 1; }
}

/* LOGIN */
.login {
  position: fixed;
  inset: 0;
  background: #000000cc;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-box {
  background: #202123;
  padding: 20px;
  border-radius: 10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login">
  <div class="login-box">
    <h3>Login</h3>
    <input id="username" placeholder="Enter name" />
    <button onclick="login()">Enter</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3 id="userDisplay"></h3>
  <div id="babyList"></div>
  <button onclick="addBaby()">➕ Add Baby</button>
</div>

<!-- MAIN -->
<div class="main">
<header id="headerTitle">BabyCare AI</header>
<div id="chat" class="chat"></div>

<div class="input-bar">
  <input id="input" placeholder="Message..." />
  <button onclick="send()">Send</button>
</div>
</div>

<script>
let user = localStorage.getItem("user");
let profiles = JSON.parse(localStorage.getItem("profiles")) || {};
let activeBaby = localStorage.getItem("activeBaby");

/* LOGIN */
function login() {
  user = document.getElementById("username").value;
  if (!user) return;

  localStorage.setItem("user", user);
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("userDisplay").innerText = "👤 " + user;
}

/* AUTO LOGIN */
if (user) {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("userDisplay").innerText = "👤 " + user;
}

/* SAVE */
function save() {
  localStorage.setItem("profiles", JSON.stringify(profiles));
  localStorage.setItem("activeBaby", activeBaby);
}

/* BABIES */
function renderBabies() {
  const list = document.getElementById("babyList");
  list.innerHTML = "";

  for (let name in profiles) {
    const div = document.createElement("div");
    div.className = "baby" + (name === activeBaby ? " active" : "");
    div.innerText = `${name} (${profiles[name].age}m)`;

    div.onclick = () => {
      activeBaby = name;
      save();
      loadChat();
      renderBabies();
      updateHeader();
    };

    list.appendChild(div);
  }
}

/* ADD BABY */
function addBaby() {
  let name = prompt("Baby name:");
  if (!name) return;

  let age = prompt("Age (months):");
  if (!age) return;

  profiles[name] = { age, chat: [] };
  activeBaby = name;

  save();
  renderBabies();
  updateHeader();
}

/* HEADER */
function updateHeader() {
  if (!activeBaby) return;

  document.getElementById("headerTitle").innerText =
    `${activeBaby} — ${profiles[activeBaby].age} months`;
}

/* CHAT SAVE */
function saveMessage(text, type) {
  profiles[activeBaby].chat.push({ text, type });
  save();
}

/* LOAD CHAT */
function loadChat() {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  if (!profiles[activeBaby].chat) return;

  profiles[activeBaby].chat.forEach(m => addMsg(m.text, m.type));
}

/* MESSAGE */
function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerText = text;

  div.appendChild(bubble);
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

/* TYPING */
function showTyping() {
  const div = document.createElement("div");
  div.className = "message ai";
  div.id = "typing";

  div.innerHTML = `
    <div class="bubble">
      <div class="typing">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  `;

  document.getElementById("chat").appendChild(div);
}

function removeTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

/* AI */
function aiReply(msg) {
  let age = profiles[activeBaby]?.age || "unknown";

  if (msg.includes("cry")) {
    return `Your baby may be crying.

Age: ${age} months
• Check hunger
• Check sleep
• Check diaper`;
  }

  if (age === "unknown") {
    return "How old is your baby?";
  }

  return `Helping your ${age}-month-old baby 👶`;
}

/* SEND */
function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text || !activeBaby) return;

  addMsg(text, "user");
  saveMessage(text, "user");
  input.value = "";

  showTyping();

  setTimeout(() => {
    removeTyping();
    const reply = aiReply(text);
    addMsg(reply, "ai");
    saveMessage(reply, "ai");
  }, 800);
}

/* INIT */
renderBabies();
updateHeader();
if (activeBaby) loadChat();
</script>

</body>
</html>
</html>
