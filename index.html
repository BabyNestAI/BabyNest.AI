<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BabyCare AI</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #343541;
  color: #ececf1;
}

/* Header */
header {
  padding: 15px;
  text-align: center;
  border-bottom: 1px solid #444;
  font-weight: 600;
}

/* Chat */
.chat-container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
  padding-bottom: 120px;
}

/* Messages */
.message {
  display: flex;
  margin: 15px 0;
}

.bubble {
  padding: 14px;
  border-radius: 12px;
  max-width: 80%;
  line-height: 1.5;
  white-space: pre-wrap;
}

/* User */
.user {
  justify-content: flex-end;
}
.user .bubble {
  background: #19c37d;
  color: black;
}

/* AI */
.ai {
  justify-content: flex-start;
}
.ai .bubble {
  background: #444654;
}

/* Input */
.input-bar {
  position: fixed;
  bottom: 40px;
  width: 100%;
  display: flex;
  justify-content: center;
}

.input-box {
  display: flex;
  width: 90%;
  max-width: 800px;
  background: #40414f;
  border-radius: 10px;
  padding: 10px;
}

input {
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  background: #19c37d;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
}

/* Footer */
.footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: #aaa;
  padding: 10px;
  background: #202123;
  border-top: 1px solid #333;
}

/* Typing dots */
.typing {
  display: flex;
  gap: 5px;
}

.dot {
  width: 6px;
  height: 6px;
  background: #ccc;
  border-radius: 50%;
  animation: blink 1.5s infinite;
}

.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; }
  40% { opacity: 1; }
}
</style>
</head>

<body>

<header>👶 BabyCare AI</header>

<div id="chat" class="chat-container"></div>

<div class="input-bar">
  <div class="input-box">
    <input id="input" placeholder="Ask about your baby..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<footer class="footer">
  © 2026 BabyCare AI. All rights reserved.
</footer>

<script>
function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerText = text;

  div.appendChild(bubble);
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "message ai";
  div.id = "typing";

  div.innerHTML = `
    <div class="bubble">
      <div class="typing">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  `;

  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

function removeTyping() {
  const typing = document.getElementById("typing");
  if (typing) typing.remove();
}

function getAIResponse(msg) {
  msg = msg.toLowerCase();

  if (msg.includes("sleep")) {
    return `Sleep Guide:
Newborns: 14–17 hrs
2–6 months: 12–16 hrs

Tips:
• consistent bedtime
• white noise
• back sleeping`;
  }

  if (msg.includes("food") || msg.includes("feed")) {
    return `Feeding:
0–6 months: milk only
6+ months: soft foods

Avoid honey + choking hazards`;
  }

  return `I can help with sleep, feeding, routines, and development. Try asking a specific question!`;
}

function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  showTyping();

  setTimeout(() => {
    removeTyping();
    addMessage(getAIResponse(text), "ai");
  }, 1000);
}
</script>

</body>
</html>
